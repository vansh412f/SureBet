<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="14" fill="#07070F"/>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="26" stroke="url(#ring)" stroke-width="2.5" fill="none"/>

  <!-- Dollar sign -->
  <text
    x="32"
    y="43"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-weight="800"
    font-size="34"
    fill="url(#dollar)"
  >$</text>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="ring" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="dollar" x1="20" y1="10" x2="44" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
</svg>
